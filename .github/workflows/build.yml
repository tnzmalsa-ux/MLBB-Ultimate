name: Build MLBB Ultimate 3D APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Full 3D Game & Bundle Three.js
        run: |
          bash part1.sh
          bash part2.sh
          bash part3.sh
          bash part4.sh
          bash part5.sh
          bash part6.sh
          bash part7.sh
          [ -f part8.sh ] && bash part8.sh || true
          bash part9.sh
          bash part10.sh
          bash part11.sh
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js -o app/src/main/assets/three.min.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mlbb-ultimate-3d-apk
          path: app/build/outputs/apk/debug/*.apk
